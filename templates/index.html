<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生信息管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; min-height: 100vh; }
        .navbar { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card { border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-radius: 12px; }
        .table th { background: #f8f9fa; border-bottom-width: 2px; font-weight: 600; color: #495057; }
        .table td { vertical-align: middle; }
        .btn-action { padding: 0.25rem 0.75rem; font-size: 0.875rem; }
        .student-id { font-family: 'Courier New', monospace; font-weight: 600; color: #4361ee; }
        .empty-state { padding: 60px 0; text-align: center; color: #adb5bd; }
        .empty-state i { font-size: 4rem; display: block; margin-bottom: 16px; }
        .search-box { max-width: 320px; }
        .stats-bar .stat-item { text-align: center; padding: 12px 20px; }
        .stats-bar .stat-value { font-size: 1.5rem; font-weight: 700; color: #4361ee; }
        .stats-bar .stat-label { font-size: 0.8rem; color: #6c757d; }
        .gender-badge { font-size: 0.8rem; padding: 0.2em 0.6em; }
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar navbar-dark bg-primary px-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            <i class="bi bi-mortarboard-fill me-2"></i>学生信息管理系统
        </span>
        <span class="text-white-50 small">MySQL 版</span>
    </div>
</nav>

<div class="container-fluid py-4">
    <!-- 统计栏 -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">学生总数</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="maleCount">0</div>
                    <div class="stat-label">男生</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="femaleCount">0</div>
                    <div class="stat-label">女生</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="avgAge">-</div>
                    <div class="stat-label">平均年龄</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 工具栏 -->
    <div class="card mb-4">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-primary" onclick="showAddModal()">
                    <i class="bi bi-plus-lg me-1"></i>添加学生
                </button>
                <button class="btn btn-outline-secondary" onclick="loadStudents()">
                    <i class="bi bi-arrow-clockwise me-1"></i>刷新
                </button>
            </div>
            <div class="input-group search-box">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="searchInput"
                       placeholder="搜索姓名或学号..." oninput="filterTable()">
            </div>
        </div>
    </div>

    <!-- 学生列表 -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="studentTable">
                    <thead>
                        <tr>
                            <th style="width: 100px;">学号</th>
                            <th>姓名</th>
                            <th>年龄</th>
                            <th>性别</th>
                            <th>专业</th>
                            <th style="width: 160px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="empty-state" style="display:none;">
                <i class="bi bi-inbox"></i>
                <p class="mb-2">暂无学生信息</p>
                <button class="btn btn-primary btn-sm" onclick="showAddModal()">
                    <i class="bi bi-plus-lg me-1"></i>添加第一位学生
                </button>
            </div>
        </div>
    </div>
</div>


<!-- 添加/编辑弹窗 -->
<div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">添加学生</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label class="form-label">姓名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" required
                               placeholder="请输入学生姓名" maxlength="50">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">年龄</label>
                        <input type="number" class="form-control" id="age"
                               placeholder="请输入年龄" min="1" max="150" value="18">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">性别</label>
                        <select class="form-select" id="gender">
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">专业</label>
                        <input type="text" class="form-control" id="major"
                               placeholder="请输入专业" maxlength="50">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitForm()">
                    <i class="bi bi-check-lg me-1"></i>保存
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-2"></i>确认删除</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center py-4">
                <p class="mb-1">确定要删除学生</p>
                <p class="fw-bold text-danger fs-5" id="deleteStudentName"></p>
                <p class="text-muted small mb-0">此操作不可撤销</p>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                    <i class="bi bi-trash me-1"></i>确认删除
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allStudents = [];
    const studentModal = new bootstrap.Modal('#studentModal');
    const deleteModal = new bootstrap.Modal('#deleteModal');
    let deleteTargetId = null;

    // ---------- 加载数据 ----------
    async function loadStudents() {
        try {
            const res = await fetch('/api/students');
            if (!res.ok) throw new Error('加载失败');
            allStudents = await res.json();
            renderTable(allStudents);
            updateStats(allStudents);
        } catch (e) {
            showToast('加载学生数据失败，请检查数据库连接', 'danger');
        }
    }

    // ---------- 渲染表格 ----------
    function renderTable(students) {
        const tbody = document.getElementById('studentTableBody');
        const empty = document.getElementById('emptyState');
        const table = document.getElementById('studentTable');

        if (students.length === 0) {
            tbody.innerHTML = '';
            empty.style.display = 'block';
            table.style.display = 'none';
            return;
        }

        empty.style.display = 'none';
        table.style.display = 'table';

        tbody.innerHTML = students.map(s => `
            <tr>
                <td><span class="student-id">${s.id}</span></td>
                <td><strong>${escHtml(s.name)}</strong></td>
                <td>${s.age}</td>
                <td>
                    <span class="badge gender-badge ${s.gender === '男' ? 'bg-primary' : 'bg-pink text-dark'}"
                          style="${s.gender === '女' ? 'background:#f8d7da !important' : ''}">
                        ${escHtml(s.gender)}
                    </span>
                </td>
                <td>${escHtml(s.major) || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary btn-action me-1"
                            onclick="showEditModal(${s.id})">
                        <i class="bi bi-pencil-square me-1"></i>编辑
                    </button>
                    <button class="btn btn-sm btn-outline-danger btn-action"
                            onclick="showDeleteModal(${s.id}, '${escHtml(s.name)}')">
                        <i class="bi bi-trash me-1"></i>删除
                    </button>
                </td>
            </tr>
        `).join('');
    }

    // ---------- 更新统计 ----------
    function updateStats(students) {
        document.getElementById('totalCount').textContent = students.length;
        document.getElementById('maleCount').textContent = students.filter(s => s.gender === '男').length;
        document.getElementById('femaleCount').textContent = students.filter(s => s.gender === '女').length;

        if (students.length > 0) {
            const avg = students.reduce((sum, s) => sum + s.age, 0) / students.length;
            document.getElementById('avgAge').textContent = avg.toFixed(1);
        } else {
            document.getElementById('avgAge').textContent = '-';
        }
    }

    // ---------- 搜索过滤 ----------
    function filterTable() {
        const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!keyword) {
            renderTable(allStudents);
            return;
        }
        const filtered = allStudents.filter(s =>
            s.name.toLowerCase().includes(keyword) ||
            String(s.id).includes(keyword)
        );
        renderTable(filtered);
    }

    // ---------- 添加弹窗 ----------
    function showAddModal() {
        document.getElementById('modalTitle').textContent = '添加学生';
        document.getElementById('editId').value = '';
        document.getElementById('name').value = '';
        document.getElementById('age').value = '18';
        document.getElementById('gender').value = '男';
        document.getElementById('major').value = '';
        studentModal.show();
    }

    // ---------- 编辑弹窗 ----------
    async function showEditModal(id) {
        try {
            const res = await fetch(`/api/students/${id}`);
            if (!res.ok) throw new Error('查询失败');
            const s = await res.json();

            document.getElementById('modalTitle').textContent = '编辑学生';
            document.getElementById('editId').value = s.id;
            document.getElementById('name').value = s.name;
            document.getElementById('age').value = s.age;
            document.getElementById('gender').value = s.gender;
            document.getElementById('major').value = s.major;
            studentModal.show();
        } catch (e) {
            showToast('获取学生信息失败', 'danger');
        }
    }

    // ---------- 删除弹窗 ----------
    function showDeleteModal(id, name) {
        deleteTargetId = id;
        document.getElementById('deleteStudentName').textContent = name;
        document.getElementById('confirmDeleteBtn').onclick = confirmDelete;
        deleteModal.show();
    }

    // ---------- 提交表单 ----------
    async function submitForm() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('name').value.trim();
        const age = parseInt(document.getElementById('age').value) || 18;
        const gender = document.getElementById('gender').value;
        const major = document.getElementById('major').value.trim();

        if (!name) {
            showToast('请输入学生姓名', 'warning');
            return;
        }

        const data = { name, age, gender, major };

        try {
            let res;
            if (id) {
                res = await fetch(`/api/students/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } else {
                res = await fetch('/api/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            }

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error || '操作失败');
            }

            studentModal.hide();
            showToast(id ? '学生信息修改成功' : '学生添加成功', 'success');
            loadStudents();
        } catch (e) {
            showToast(e.message, 'danger');
        }
    }

    // ---------- 确认删除 ----------
    async function confirmDelete() {
        if (!deleteTargetId) return;
        try {
            const res = await fetch(`/api/students/${deleteTargetId}`, { method: 'DELETE' });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error || '删除失败');
            }
            deleteModal.hide();
            showToast('学生删除成功', 'success');
            loadStudents();
        } catch (e) {
            showToast(e.message, 'danger');
        }
    }

    // ---------- Toast 提示 ----------
    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const icons = { success: 'check-circle', danger: 'x-circle', warning: 'exclamation-circle', info: 'info-circle' };
        const bgClass = type === 'success' ? 'bg-success' : type === 'danger' ? 'bg-danger' : type === 'warning' ? 'bg-warning text-dark' : 'bg-info';

        const html = `
            <div class="toast align-items-center text-white ${bgClass} border-0 mb-2" role="alert">
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi bi-${icons[type]} me-2"></i>${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>`;

        container.insertAdjacentHTML('beforeend', html);
        const toastEl = container.lastElementChild;
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    // ---------- 工具函数 ----------
    function escHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ---------- 页面初始化 ----------
    document.addEventListener('DOMContentLoaded', loadStudents);
</script>
</body>
</html>
